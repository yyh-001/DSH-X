<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<title>DSH-X</title>
<style>
/* 与管理页共用浅色配色；安装页保持独立内嵌，离线也能完整显示。 */
:root{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-synthesis:none;color:var(--text);--bg:#eef3fd;--card:#fff;--line:#d8e2f7;--text:#16233d;--muted:#6b7d9c;--accent:#3b6fe0;--accent-soft:#eaf1ff;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);overflow:hidden;user-select:none}button,input{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{cursor:default}svg{width:16px;height:16px;flex-shrink:0}svg[hidden]{display:none}
.shell{height:100vh;min-height:480px;position:relative;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;padding:0 16px 0 24px;gap:10px}.brand-icon{width:28px;height:28px;border-radius:8px;pointer-events:none}.wordmark{font-weight:700;font-size:17px;color:var(--accent);pointer-events:none}.caption{font-size:12px;color:var(--muted);pointer-events:none}.window-actions{margin-left:auto;display:flex;gap:4px}.win-btn{width:32px;height:30px;display:grid;place-items:center;padding:0;border-radius:7px;color:var(--muted);background:transparent;transition:background .18s,color .18s}.win-btn svg{width:12px;height:12px}.win-btn:hover{color:var(--accent);background:var(--accent-soft)}.win-btn.close:hover{background:#e11d48;color:white}
.content{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px 32px}.copy{width:100%;max-width:460px;padding:32px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #3b6fe00b}h1{font-size:28px;font-weight:650;line-height:1.35;margin:0 0 10px}.description{font-size:13px;line-height:1.7;color:var(--muted);margin:0}.stage{animation:arrive .35s var(--ease) both}
.actions{margin-top:26px}.primary{width:100%;min-height:44px;padding:10px 16px;border-radius:9px;background:var(--accent);color:white;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .18s,transform .18s}.primary:hover:not(:disabled){background:#2d5fc9}.primary:active:not(:disabled){transform:scale(.99)}.primary:disabled{background:#8eadee}.arrow{transition:transform .18s}.primary:hover:not(:disabled) .arrow{transform:translateX(2px)}
.secondary{background:none;color:var(--muted);font-size:12px;padding:0 12px;min-height:36px;display:flex;align-items:center;justify-content:center;gap:6px;margin:8px auto 0;border-radius:8px}.secondary:hover{color:var(--accent);background:var(--accent-soft)}.chevron{width:14px;height:14px;transition:transform .25s}.expanded .chevron{transform:rotate(180deg)}.options{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease),opacity .2s;opacity:0}.options.open{grid-template-rows:1fr;opacity:1}.options-inner{overflow:hidden}.options-body{padding:14px 4px 4px}.path-label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.path-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px 6px 4px 10px}.path-row input{min-width:0;width:100%;height:28px;border:0;background:none;font-size:12px;color:var(--text);user-select:text}.browse{display:grid;place-items:center;width:30px;height:28px;flex-shrink:0;border-radius:6px;background:var(--accent-soft);color:var(--accent)}.browse:hover{background:#e2ebff}.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:14px;cursor:pointer}.check input{accent-color:var(--accent);margin:0;width:14px;height:14px}
.foot{height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;color:var(--muted);font-size:11px}.foot strong{font-weight:400}.progress{margin:24px 0 0;display:none}.track{height:6px;border-radius:6px;background:var(--accent-soft);overflow:hidden}.fill{height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .4s var(--ease)}.progress-meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--muted);font-size:12px}.error{font-size:12px;color:#be123c;line-height:1.6;max-height:72px;overflow:auto;overflow-wrap:anywhere;white-space:pre-line;margin:16px 0 0;user-select:text}.finish-options{display:none;gap:16px;align-items:center;flex-wrap:wrap;margin:18px 0 0}.finish-options .check{margin:0}.busy .progress{display:block}.busy .options,.busy #optionsToggle,.done #optionsToggle,.done .options{display:none}.done .finish-options{display:flex}
.confirm{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#16233d40;padding:32px;opacity:1;transition:opacity .2s,display .2s allow-discrete}.confirm[hidden]{display:none;opacity:0}.dialog{width:100%;max-width:360px;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 48px #16233d20;font-size:13px;line-height:1.7;transform:translateY(0);transition:transform .2s var(--ease)}.confirm[hidden] .dialog{transform:translateY(8px)}.dialog h2{font-size:20px;margin:0 0 10px}.dialog p{color:var(--muted);margin:0 0 22px}
@starting-style{.confirm{opacity:0}.confirm .dialog{transform:translateY(8px)}}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.reduce-motion *, .reduce-motion *::before,.reduce-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-height:520px){.content{padding:12px 24px}.copy{padding:24px}.actions{margin-top:20px}}@media(max-width:520px){.content{padding:16px}.copy{padding:24px}h1{font-size:25px}.caption{display:none}.foot{padding:0 16px;font-size:10px}}
</style>
</head>
<body><main class="shell" id="shell">
<header class="topbar" id="drag"><img class="brand-icon" src="__MASCOT__" alt=""><div class="wordmark">DSH-X</div><div class="caption" id="caption"></div><div class="window-actions"><button class="win-btn" id="minimize" aria-label="最小化"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 8h10"/></svg></button><button class="win-btn close" id="close" aria-label="关闭"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div></header>
<div class="content"><section class="copy"><div class="stage" id="stage" aria-live="polite"><h1 id="heading"></h1><p class="description" id="description"></p></div>
<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="track"><div class="fill" id="fill"></div></div><div class="progress-meta"><span id="progressLabel"></span><span id="percent">0%</span></div></div>
<p class="error" id="error" role="alert" hidden></p><div class="actions"><button class="primary" id="primary"><span id="buttonText"></span><svg class="arrow" id="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button><button class="secondary" id="optionsToggle" aria-expanded="false" aria-controls="options"><span id="optionsText"></span><svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><div class="options" id="options" inert><div class="options-inner"><div class="options-body"><label class="path-label" id="pathText" for="path"></label><div class="path-row"><input id="path" aria-label="安装目录" spellcheck="false"><button class="browse" id="browse" aria-label="选择文件夹"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5h6l2 3h10v11H3V8Z"/></svg></button></div><label class="check"><input type="checkbox" id="desktop" checked><span id="desktopText"></span></label></div></div></div><div class="finish-options"><label class="check"><input type="checkbox" id="launch" checked><span id="launchText"></span></label><label class="check"><input type="checkbox" id="delete"><span id="deleteText"></span></label></div></div></section></div>
<footer class="foot"><strong id="version"></strong><span id="footnote"></span></footer><div class="confirm" id="confirm" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText"><h2 id="confirmTitle"></h2><p id="confirmText"></p><button class="primary" id="keepGoing"></button></div></div>
</main>
<script>
const config=window.__INSTALLER__||{preview:true,language:navigator.language,version:'preview',path:'C:\\Users\\you\\AppData\\Local\\Programs\\DSH'};
const zh=String(config.language).toLowerCase().startsWith('zh');
const t=zh?{caption:'安装程序',title:'安装 DSH-X',description:'DeepSeek Harness 第三方启动器',install:'安装',options:'安装选项',desktop:'创建桌面快捷方式',launch:'启动 DSH-X',delete:'删除安装包',pre:'界面预览 · 不会实际安装',busyTitle:'正在安装',busyDescription:'请稍候，安装完成后即可使用。',busyButton:'正在安装',progress:'正在准备安装',stages:{preparing:'正在准备安装',files:'正在解压文件',finishing:'正在完成安装',cleaning:'正在清理临时文件'},doneTitle:'安装完成',doneDescription:'DSH-X 已安装到你的电脑。',doneButton:'完成',failedTitle:'安装失败',failedDescription:'请查看下方错误信息后重试。',retry:'重试',confirmTitle:'正在安装',confirmText:'请等待安装完成后再关闭窗口。',keep:'继续安装',path:'安装目录',browse:'选择文件夹',close:'关闭',minimize:'最小化'}:{caption:'Setup',title:'Install DSH-X',description:'A third-party launcher for DeepSeek Harness',install:'Install',options:'Installation options',desktop:'Create a desktop shortcut',launch:'Launch DSH-X',delete:'Delete installer',pre:'UI preview · No installation',busyTitle:'Installing',busyDescription:'Please wait while DSH-X is installed.',busyButton:'Installing',progress:'Preparing installation',stages:{preparing:'Preparing installation',files:'Extracting files',finishing:'Finishing installation',cleaning:'Cleaning temporary files'},doneTitle:'Installation complete',doneDescription:'DSH-X is installed on your computer.',doneButton:'Finish',failedTitle:'Installation failed',failedDescription:'Review the error below and try again.',retry:'Retry',confirmTitle:'Installing',confirmText:'Please wait for installation to finish before closing.',keep:'Continue installation',path:'Installation folder',browse:'Choose folder',close:'Close',minimize:'Minimize'};
const $=id=>document.getElementById(id);let state='ready',previewTimer;
function send(action,extra={}){const message={action,...extra};if(window.ipc)window.ipc.postMessage(JSON.stringify(message));else if(config.preview&&action==='install')demo();}
function changeStage(title,description){$('heading').textContent=title;$('description').textContent=description;$('stage').getAnimations().forEach(a=>a.cancel());if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&!config.reducedMotion)$('stage').animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:420,easing:'cubic-bezier(.22,1,.36,1)'});}
function render(next){state=next;$('shell').classList.toggle('busy',next==='busy');$('shell').classList.toggle('done',next==='done');$('primary').disabled=next==='busy';$('arrow').toggleAttribute('hidden',next==='busy');$('confirm').hidden=true;$('error').hidden=next!=='error';if(next==='busy'){changeStage(t.busyTitle,t.busyDescription);$('buttonText').textContent=t.busyButton;setOptions(false);}else if(next==='done'){changeStage(t.doneTitle,t.doneDescription);$('buttonText').textContent=t.doneButton;}else if(next==='error'){changeStage(t.failedTitle,t.failedDescription);$('buttonText').textContent=t.retry;}else{changeStage(t.title,t.description);$('buttonText').textContent=t.install;}}
function setOptions(open){$('options').classList.toggle('open',open);$('options').inert=!open;$('optionsToggle').classList.toggle('expanded',open);$('optionsToggle').setAttribute('aria-expanded',String(open));}
window.installerEvent=function(event){if(event.type==='progress'){if(state!=='busy')render('busy');const p=Math.min(100,Math.max(0,Number(event.percent)||0));$('fill').style.width=p+'%';$('percent').textContent=p+'%';$('progress').setAttribute('aria-valuenow',p);const stage=t.stages&&t.stages[event.stage];if(stage)$('progressLabel').textContent=stage;}else if(event.type==='done'){render('done');}else if(event.type==='error'){$('error').textContent=event.message||'';render('error');}else if(event.type==='path'){$('path').value=event.path;}else if(event.type==='close-request'){requestClose();}};
function demo(){render('busy');let p=0;clearInterval(previewTimer);previewTimer=setInterval(()=>{p+=5;const stage=p<8?'preparing':p<82?'files':p<96?'finishing':'cleaning';installerEvent({type:'progress',stage,percent:p});if(p>=100){clearInterval(previewTimer);installerEvent({type:'done'});}},190);}
function requestClose(){if(state==='busy'){$('confirm').hidden=false;$('keepGoing').focus();}else send('close');}
$('primary').onclick=()=>{if(state==='done'){send('finish',{launch:$('launch').checked,deleteInstaller:$('delete').checked});return;}if(state==='busy')return;if(config.preview){demo();return;}render('busy');send('install',{path:$('path').value,desktop:$('desktop').checked});};
$('optionsToggle').onclick=()=>setOptions($('optionsToggle').getAttribute('aria-expanded')!=='true');$('browse').onclick=()=>send('browse');$('close').onclick=requestClose;$('minimize').onclick=()=>send('minimize');$('keepGoing').onclick=()=>{$('confirm').hidden=true;$('primary').focus();};$('drag').onmousedown=e=>{if(e.button===0&&!e.target.closest('button'))send('drag');};document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!$('confirm').hidden)$('confirm').hidden=true;else requestClose();}});
for(const [id,key]of Object.entries({caption:'caption',pathText:'path',optionsText:'options',desktopText:'desktop',launchText:'launch',deleteText:'delete',progressLabel:'progress',confirmTitle:'confirmTitle',confirmText:'confirmText',keepGoing:'keep'}))$(id).textContent=t[key];$('path').value=config.path;$('path').setAttribute('aria-label',t.path);$('progress').setAttribute('aria-label',t.busyButton);for(const id of ['browse','close','minimize']){$(id).setAttribute('aria-label',t[id]);$(id).title=t[id];}$('version').textContent='DSH-X '+config.version;$('footnote').textContent=config.preview?t.pre:'';document.documentElement.lang=zh?'zh-CN':'en';document.documentElement.classList.toggle('reduce-motion',!!config.reducedMotion);render('ready');
</script></body></html>
