<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<title>DSH-X</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#262738;font-synthesis:none;--violet:#7974df;--muted:#9897a7;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}body{margin:0;background:#f8f8fc;overflow:hidden;user-select:none}button,input{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #b8afff;outline-offset:4px}button:disabled{cursor:default}.shell{height:100vh;min-height:480px;position:relative;overflow:hidden;border:1px solid #fff;border-radius:22px;background:radial-gradient(ellipse at 12% 42%,#eaeaff 0,transparent 47%),radial-gradient(ellipse at 42% 110%,#f6e9f5 0,transparent 49%),linear-gradient(120deg,#f8f8ff,#fdfdfe 70%)}.topbar{height:64px;display:flex;align-items:center;padding:0 27px;gap:9px;position:relative;z-index:5}.traffic{width:13px;height:13px;border-radius:50%;padding:0;transition:filter .2s,transform .2s;display:grid;place-content:center}.traffic span{font-size:11px;line-height:13px;color:#663333;opacity:0}.traffic:hover span,.traffic:focus-visible span{opacity:1}.traffic:hover{filter:saturate(1.4)}.traffic:active{transform:scale(.9)}.close{background:#ffb4b6}.min{background:#f2d492}.wordmark{position:absolute;left:50%;transform:translateX(-50%);letter-spacing:.22em;font-weight:650;font-size:12px;color:#777588;pointer-events:none}.caption{margin-left:auto;font-size:10px;color:#a7a4b5;letter-spacing:.1em}.content{display:grid;grid-template-columns:42% 58%;align-items:center;height:calc(100% - 114px);padding:0 44px 12px 20px}.scene{height:340px;position:relative;display:grid;place-items:center}.halo{position:absolute;width:258px;height:258px;border-radius:50%;border:1px solid #ffffffc9;box-shadow:inset 0 0 40px #ffffff70,0 30px 65px #aaa7df16;background:linear-gradient(145deg,#ffffff3d,#eeeeff26)}.orbit{position:absolute;inset:30px;border:1px solid #ffffff98;border-radius:50%;transform:rotate(-24deg) scaleY(.86)}.avatar{position:relative;width:190px;height:190px;border-radius:56px;transform:rotate(-8deg);overflow:hidden;background:white;box-shadow:0 25px 50px -18px #7b77b355,0 2px 4px #ffffff;animation:float 6s ease-in-out infinite}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.spark{position:absolute;color:#b2a3dd;font-size:28px;animation:twinkle 4s ease-in-out infinite}.s1{top:34px;right:42px}.s2{bottom:58px;left:23px;font-size:16px;animation-delay:-2s}.bubble{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 17px;border:1px solid #fff;border-radius:30px;background:#ffffffb8;box-shadow:0 8px 28px #b8b2d01c;font-size:11px;white-space:nowrap;color:#868092;backdrop-filter:blur(10px)}.bubble i{font-style:normal;color:#a495d6;margin-right:6px}.copy{padding-left:27px;position:relative}.eyebrow{display:flex;gap:7px;align-items:center;color:#9691ad;font-size:10px;letter-spacing:.16em;margin-bottom:18px}.dot{width:5px;height:5px;background:#a7a0db;border-radius:50%}h1{font-size:38px;font-weight:600;line-height:1.3;letter-spacing:-1.5px;margin:0 0 17px;white-space:pre-line}.description{font-size:12px;line-height:1.9;color:#9491a1;margin:0;min-height:48px}.stage{animation:arrive .65s var(--ease) both}.actions{margin-top:27px}.primary{width:100%;height:48px;border-radius:15px;background:#7773ca;color:white;font-size:13px;font-weight:500;box-shadow:0 6px 16px #827ac82a,inset 0 1px 0 #ffffff30;display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .28s var(--ease),box-shadow .28s,background .28s}.primary:hover:not(:disabled){background:#6b66c2;transform:translateY(-2px);box-shadow:0 10px 23px #827ac83d}.primary:active:not(:disabled){transform:translateY(0) scale(.98)}.primary:disabled{background:#afadd9;box-shadow:none}.arrow{font-size:18px;font-weight:300;transition:transform .25s}.primary:hover .arrow{transform:translateX(3px)}.secondary{background:none;color:#9b97aa;font-size:11px;padding:13px 0 5px;display:block;margin:0 auto}.secondary:hover{color:#7264ad}.plus{display:inline-block;margin-left:6px;transition:transform .3s}.expanded .plus{transform:rotate(45deg)}.options{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease),opacity .25s;opacity:0}.options.open{grid-template-rows:1fr;opacity:1}.options-inner{overflow:hidden}.options-body{padding:12px 1px 3px}.path-row{display:flex;align-items:center;gap:6px;background:#f2f1f8;border:1px solid #e6e4ef;border-radius:9px;padding:5px 8px}.path-row input{min-width:0;width:100%;border:0;background:none;font-size:10px;color:#7c778f;user-select:text}.browse{background:none;color:#9c90bc;padding:2px 4px}.check{display:flex;align-items:center;gap:7px;font-size:11px;color:#8d879c;margin-top:10px}.check input{accent-color:#8b80c7;margin:0}.foot{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:#b1acbb;font-size:10px}.foot strong{font-weight:400}.progress{margin:22px 0 0;display:none}.track{height:5px;border-radius:6px;background:#eae7f3;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#a79bdf,#7b74cc);border-radius:6px;transition:width .4s var(--ease)}.progress-meta{display:flex;justify-content:space-between;margin-top:10px;color:#928ba5;font-size:10px}.error{font-size:11px;color:#b66879;line-height:1.6;max-height:54px;overflow:auto;margin:10px 0 0;user-select:text}.finish-options{display:none;gap:12px;align-items:center;margin:12px 0 0}.finish-options .check{margin:0}.busy .progress{display:block}.busy .avatar{animation-duration:4s}.busy .options,.busy #optionsToggle,.done #optionsToggle,.done .options{display:none}.done .finish-options{display:flex}.done .avatar{animation:celebrate .8s var(--ease) both,float 6s .8s ease-in-out infinite}.busy .actions{margin-top:20px}.preview{color:#aca0bf}.confirm{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#f6f5ffb3;backdrop-filter:blur(14px);padding:80px}.confirm[hidden]{display:none}.dialog{max-width:350px;padding:27px;background:#ffffffeb;border:1px solid white;border-radius:22px;box-shadow:0 20px 80px #8075a125;font-size:13px;line-height:1.8}.dialog h2{font-size:20px;margin:0 0 12px}.dialog p{color:#8b849d}.dialog button{margin-top:12px}.reduce-motion *, .reduce-motion *::before,.reduce-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-7px) rotate(-5deg)}}@keyframes twinkle{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes celebrate{0%{transform:scale(.92) rotate(-8deg)}60%{transform:scale(1.04) rotate(-4deg)}100%{transform:scale(1) rotate(-8deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-height:540px){.content{padding-top:0}.scene{height:310px}.eyebrow{margin-bottom:12px}h1{font-size:34px}.actions{margin-top:20px}.description{min-height:40px}}
</style>
</head>
<body><main class="shell" id="shell">
<header class="topbar" id="drag"><button class="traffic close" id="close" aria-label="关闭"><span>×</span></button><button class="traffic min" id="minimize" aria-label="最小化"><span>−</span></button><div class="wordmark">DSH-X</div><div class="caption" id="caption">INSTALLER</div></header>
<div class="content"><div class="scene" aria-hidden="true"><div class="halo"></div><div class="orbit"></div><div class="spark s1">✦</div><div class="spark s2">✧</div><div class="avatar"><img src="__MASCOT__" alt=""></div><div class="bubble"><i>♡</i><span id="bubble"></span></div></div>
<section class="copy"><div class="eyebrow"><span class="dot"></span> A LITTLE SPACE FOR BIG IDEAS</div><div class="stage" id="stage"><h1 id="heading"></h1><p class="description" id="description"></p></div>
<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="track"><div class="fill" id="fill"></div></div><div class="progress-meta"><span id="progressLabel"></span><span id="percent">0%</span></div></div>
<p class="error" id="error" hidden></p><div class="actions"><button class="primary" id="primary"><span id="buttonText"></span><span class="arrow" id="arrow">→</span></button><button class="secondary" id="optionsToggle" aria-expanded="false" aria-controls="options"><span id="optionsText"></span><span class="plus">+</span></button><div class="options" id="options" inert><div class="options-inner"><div class="options-body"><div class="path-row"><input id="path" aria-label="安装目录" spellcheck="false"><button class="browse" id="browse" aria-label="选择文件夹">···</button></div><label class="check"><input type="checkbox" id="desktop" checked><span id="desktopText"></span></label></div></div></div><div class="finish-options"><label class="check"><input type="checkbox" id="launch" checked><span id="launchText"></span></label><label class="check"><input type="checkbox" id="delete"><span id="deleteText"></span></label></div></div></section></div>
<footer class="foot"><strong id="version"></strong><span id="footnote"></span></footer><div class="confirm" id="confirm" hidden><div class="dialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><button class="primary" id="keepGoing"></button></div></div>
</main>
<script>
const config=window.__INSTALLER__||{preview:true,language:navigator.language,version:'preview',path:'C:\\Users\\you\\AppData\\Local\\Programs\\DSH'};
const zh=String(config.language).toLowerCase().startsWith('zh');
const t=zh?{title:'灵感，\n即刻启程。',description:'给你的 AI，一个轻巧又温暖的小窝。\n剩下的，交给 DSH-X。',bubble:'很高兴，遇见你',install:'安装 DSH-X',options:'安装选项',desktop:'创建桌面快捷方式',launch:'启动 DSH-X',delete:'删除安装包',foot:'一点轻巧，一点可能。',pre:'界面预览 · 不会实际安装',busyTitle:'好事，\n正在发生。',busyDescription:'正在为你准备 DSH-X。\n很快，就能开始了。',busyButton:'正在安装',progress:'正在安放每一份灵感',stages:{preparing:'正在准备安装',files:'正在解压文件',finishing:'正在完成安装',cleaning:'正在清理临时文件'},doneTitle:'都准备好了。',doneDescription:'新的灵感，从这里开始。\n欢迎来到 DSH-X。',doneButton:'开始使用',failedTitle:'差一点点。',failedDescription:'安装没有完成，请检查后重试。',retry:'重试安装',confirmTitle:'还在安装中',confirmText:'关闭窗口不会更快。请等待安装完成，以免留下不完整的文件。',keep:'继续等待',path:'安装目录',browse:'选择文件夹',close:'关闭',minimize:'最小化'}:{title:'A little space.\nEndless ideas.',description:'A light, cozy home for your AI.\nDSH-X takes care of the rest.',bubble:'So happy you are here',install:'Install DSH-X',options:'Installation options',desktop:'Create a desktop shortcut',launch:'Launch DSH-X',delete:'Delete installer',foot:'Light on your desktop. Big on possibilities.',pre:'UI preview · No installation',busyTitle:'Good things\nare coming.',busyDescription:'Getting DSH-X ready for you.\nJust a little moment.',busyButton:'Installing',progress:'Making room for your next idea',stages:{preparing:'Preparing installation',files:'Extracting files',finishing:'Finishing installation',cleaning:'Cleaning temporary files'},doneTitle:'Make yourself\nat home.',doneDescription:'Your next idea starts here.\nWelcome to DSH-X.',doneButton:'Let’s go',failedTitle:'Almost there.',failedDescription:'Setup could not finish. Please check and retry.',retry:'Try again',confirmTitle:'Still installing',confirmText:'Please wait for setup to finish so that no incomplete files are left behind.',keep:'Keep waiting',path:'Installation folder',browse:'Choose folder',close:'Close',minimize:'Minimize'};
const $=id=>document.getElementById(id);let state='ready',previewTimer;
function send(action,extra={}){const message={action,...extra};if(window.ipc)window.ipc.postMessage(JSON.stringify(message));else if(config.preview&&action==='install')demo();}
function changeStage(title,description){$('heading').textContent=title;$('description').textContent=description;$('stage').getAnimations().forEach(a=>a.cancel());if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&!config.reducedMotion)$('stage').animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:420,easing:'cubic-bezier(.22,1,.36,1)'});}
function render(next){state=next;$('shell').classList.toggle('busy',next==='busy');$('shell').classList.toggle('done',next==='done');$('primary').disabled=next==='busy';$('arrow').hidden=next==='busy';$('confirm').hidden=true;$('error').hidden=next!=='error';if(next==='busy'){changeStage(t.busyTitle,t.busyDescription);$('buttonText').textContent=t.busyButton;setOptions(false);}else if(next==='done'){changeStage(t.doneTitle,t.doneDescription);$('buttonText').textContent=t.doneButton;}else if(next==='error'){changeStage(t.failedTitle,t.failedDescription);$('buttonText').textContent=t.retry;}else{changeStage(t.title,t.description);$('buttonText').textContent=t.install;}}
function setOptions(open){$('options').classList.toggle('open',open);$('options').inert=!open;$('optionsToggle').classList.toggle('expanded',open);$('optionsToggle').setAttribute('aria-expanded',String(open));}
window.installerEvent=function(event){if(event.type==='progress'){if(state!=='busy')render('busy');const p=Math.min(100,Math.max(0,Number(event.percent)||0));$('fill').style.width=p+'%';$('percent').textContent=p+'%';$('progress').setAttribute('aria-valuenow',p);const stage=t.stages&&t.stages[event.stage];if(stage)$('progressLabel').textContent=stage;}else if(event.type==='done'){render('done');}else if(event.type==='error'){$('error').textContent=event.message||'';render('error');}else if(event.type==='path'){$('path').value=event.path;}else if(event.type==='close-request'){requestClose();}};
function demo(){render('busy');let p=0;clearInterval(previewTimer);previewTimer=setInterval(()=>{p+=5;const stage=p<8?'preparing':p<82?'files':p<96?'finishing':'cleaning';installerEvent({type:'progress',stage,percent:p});if(p>=100){clearInterval(previewTimer);installerEvent({type:'done'});}},190);}
function requestClose(){if(state==='busy'){$('confirm').hidden=false;$('keepGoing').focus();}else send('close');}
$('primary').onclick=()=>{if(state==='done'){send('finish',{launch:$('launch').checked,deleteInstaller:$('delete').checked});return;}if(state==='busy')return;if(config.preview){demo();return;}render('busy');send('install',{path:$('path').value,desktop:$('desktop').checked});};
$('optionsToggle').onclick=()=>setOptions($('optionsToggle').getAttribute('aria-expanded')!=='true');$('browse').onclick=()=>send('browse');$('close').onclick=requestClose;$('minimize').onclick=()=>send('minimize');$('keepGoing').onclick=()=>{$('confirm').hidden=true;$('primary').focus();};$('drag').onmousedown=e=>{if(e.button===0&&!e.target.closest('button'))send('drag');};document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!$('confirm').hidden)$('confirm').hidden=true;else requestClose();}});
for(const [id,key]of Object.entries({bubble:'bubble',optionsText:'options',desktopText:'desktop',launchText:'launch',deleteText:'delete',progressLabel:'progress',confirmTitle:'confirmTitle',confirmText:'confirmText',keepGoing:'keep'}))$(id).textContent=t[key];$('path').value=config.path;$('path').setAttribute('aria-label',t.path);for(const id of ['browse','close','minimize'])$(id).setAttribute('aria-label',t[id]);$('version').textContent='DSH-X  /  '+config.version;$('footnote').textContent=config.preview?t.pre:t.foot;document.documentElement.lang=zh?'zh-CN':'en';document.documentElement.classList.toggle('reduce-motion',!!config.reducedMotion);render('ready');
</script></body></html>
