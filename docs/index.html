<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH-X</title>
  <meta name="description" content="DeepSeek Harness 轻量启动器。选一个版本，启动 DSH web。" />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <style>
    :root {
      --bg: #eef3fd;
      --card: #fff;
      --line: #d8e2f7;
      --text: #16233d;
      --muted: #6b7d9c;
      --accent: #3b6fe0;
      --accent-soft: #eaf1ff;
      --accent-dim: #e2ebff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
    }
    /* 和启动器同一套背景：淡蓝渐变铺底，角色由 mascot.js 放进来 */
    .backdrop {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse at 25% 10%, #f1fbff, #d9eaf7 65%, #d2e3f5);
    }
    .backdrop-character {
      position: absolute;
      left: -3vh;
      bottom: -7vh;
      width: min(76vh, 62vw);
      aspect-ratio: 1;
      background: url("./background-character.png") center / contain no-repeat;
      opacity: .46;
    }
    .water-surface { display: block; width: 100%; height: 100%; pointer-events: none; opacity: .78; }
    .water-surface[hidden] { display: none; }
    a { color: inherit; }
    .wrap {
      position: relative;
      z-index: 3;
      width: calc(100% - 48px);
      max-width: 1140px;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .wrap { width: calc(100% - 144px); }
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 50px;
      padding-top: 8px;
    }
    .gh { margin-right: auto; }
    .gh {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      text-decoration: none;
      color: var(--text);
    }
    .gh:hover .gh-name { color: var(--accent); }
    .gh svg.mark { width: 1.5rem; height: 1.5rem; fill: currentColor; flex-shrink: 0; }
    .gh-name { font-size: 1rem; font-weight: 600; transition: color .18s ease; }
    .stars {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      height: 1.5rem;
      padding: 0 .5rem;
      border: 1px solid var(--line);
      border-radius: .375rem;
      background: var(--card);
      color: var(--muted);
      font-size: .75rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .stars svg { width: .875rem; height: .875rem; fill: #eab308; }
    /* 下载次数：安安静静待在按钮右边的说明文字，不做成第二个按钮；数据没拉到就整块不显示 */
    .dl {
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      color: var(--dim);
      font-size: .8125rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .dl b { color: var(--muted); font-weight: 600; }
    .dl svg { width: .9375rem; height: .9375rem; fill: currentColor; opacity: .55; }
    .dl[hidden] { display: none; }
    .lang {
      margin-left: .5rem;
      height: 1.5rem;
      padding: 0 .625rem;
      border: 1px solid var(--line);
      border-radius: .375rem;
      background: var(--card);
      color: var(--muted);
      font: inherit;
      font-size: .75rem;
      font-weight: 500;
      cursor: pointer;
    }
    .lang:hover { color: var(--accent); border-color: var(--accent); }
    .stage {
      display: grid;
      align-items: center;
      gap: 2.5rem;
      min-height: calc(100svh - 50px);
      padding: 1.5rem 0 2.5rem;
    }
    @media (min-width: 960px) {
      .stage {
        grid-template-columns: minmax(0, .86fr) minmax(0, 1.14fr);
        gap: 2rem;
      }
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 3.85rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.12;
      color: var(--accent);
    }
    .lead {
      margin: 1.5rem 0 0;
      max-width: 34rem;
      color: var(--text);
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      font-weight: 400;
      line-height: 1.55;
    }
    .note {
      display: flex;
      align-items: flex-start;
      gap: .5rem;
      margin: 1rem 0 0;
      max-width: 34rem;
      color: var(--muted);
      font-size: .8125rem;
      line-height: 1.45;
    }
    .note svg { width: 1rem; height: 1rem; flex-shrink: 0; margin-top: .1rem; opacity: .8; }
    .cta { margin-top: 1.7rem; display: flex; flex-wrap: wrap; gap: 1rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      height: 54px;
      padding: 0 1.25rem;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: 0;
      white-space: nowrap;
    }
    .btn svg { width: 1.5rem; height: 1.5rem; fill: currentColor; }
    .btn-go { background: var(--accent); color: #fff; box-shadow: 0 8px 22px rgba(59, 111, 224, .28); }
    .btn-go:hover { background: #3462cb; }
    .btn-alt { background: var(--card); color: var(--accent); border: 1px solid #cfe0f7; box-shadow: 0 6px 16px rgba(59, 111, 224, .1); }
    .btn-alt:hover { background: var(--accent-soft); border-color: #b9ccf0; }
    .cta-note { margin: .7rem 0 0; color: var(--muted); font-size: .8125rem; line-height: 1.45; }
    .links { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; }
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      height: 2.5rem;
      padding: 0 .875rem;
      border-radius: .625rem;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--accent);
      text-decoration: none;
      font-size: .875rem;
      font-weight: 600;
    }
    .btn-ghost:hover { border-color: #b9ccf0; background: var(--accent-soft); }
    .btn-ghost svg { width: 1.125rem; height: 1.125rem; fill: currentColor; }
    .ver {
      color: var(--muted);
      font-size: .8125rem;
      text-decoration: none;
    }
    .ver:hover { color: var(--accent); }
    .ver:empty { display: none; }
    .shot {
      margin: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: 0 24px 60px rgba(22, 35, 61, .16);
    }
    .shot img { display: block; width: 100%; }
    @media (min-width: 960px) {
      .visual { overflow: visible; }
      .shot { width: 118%; }
    }
    @media (max-width: 639px) {
      .gh-name { display: none; }
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
  <link rel="stylesheet" href="./mascot.css" />
  <style>
    /* mascot.css 是从启动器原样拷来的，那份保持不动；这里只按落地页的版式微调：
       启动器左列没有正文，角色可以铺很大，落地页左列是文案，按原尺寸会压住免责说明。 */
    .mascot { width: min(46vh, 30vw); left: -5vh; bottom: -9vh; }
    .mascot svg { opacity: .62; }
    @media (max-width: 900px) {
      .mascot { width: min(38vh, 48vw); bottom: -6vh; }
      .mascot svg { opacity: .5; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <canvas class="water-surface" aria-hidden="true"></canvas>
    <div class="backdrop-character"></div>
  </div>
  <div class="wrap">
    <header>
      <a class="gh" href="https://github.com/yyh-001/DSH-X" id="gh" aria-label="GitHub">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.3-5.28-1.29-5.28-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.16 1.18a10.9 10.9 0 0 1 5.75 0c2.2-1.49 3.16-1.18 3.16-1.18.62 1.59.23 2.77.11 3.06.74.81 1.18 1.84 1.18 3.1 0 4.42-2.71 5.39-5.29 5.68.42.36.78 1.07.78 2.15v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
        <span class="gh-name">GitHub</span>
        <span class="stars" id="stars" title="GitHub stars">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
          <span id="star-count">Star</span>
        </span>
      </a>
      <button class="lang" id="lang" type="button" aria-label="切换语言 / Switch language">EN</button>
    </header>
  </div>
  <div class="wrap stage">
    <div class="copy">
      <h1>DSH-X</h1>
      <p class="lead" data-zh="选一个版本，启动 dsh web。" data-en="Pick a version, start dsh web.">选一个版本，启动 dsh web。</p>
      <p class="note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span data-zh="社区开源项目，并非 DeepSeek 官方产品，与 DeepSeek 无隶属或背书关系。" data-en="A community open-source project, not an official DeepSeek product and not affiliated with or endorsed by DeepSeek.">社区开源项目，并非 DeepSeek 官方产品，与 DeepSeek 无隶属或背书关系。</span>
      </p>
      <div class="cta">
        <a class="btn btn-go" id="download" href="https://github.com/yyh-001/DSH-X/releases/latest/download/DSH-Setup.exe">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4.2 10.5 3v8.15H2V4.2Zm9.5-1.34L22 1.35v9.8H11.5V2.86ZM2 12.15h8.5V20.3L2 19.1v-6.95Zm9.5 0H22v9.8l-10.5-1.51v-8.29Z"/></svg>
          <span data-zh="下载 Windows 版" data-en="Download for Windows">下载 Windows 版</span>
        </a>
        <a class="btn btn-alt" id="downloadMac" href="https://github.com/yyh-001/DSH-X/releases/latest/download/DSH-X-mac-arm64.dmg">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 1.43c0 1.14-.44 2.2-1.19 3.01-.9.98-2.4 1.74-3.6 1.63-.15-1.13.45-2.3 1.17-3.1.8-.9 2.32-1.6 3.62-1.54Zm4.13 15.77c-.6 1.38-.89 2-1.66 3.22-1.07 1.7-2.58 3.82-4.45 3.83-1.66.02-2.09-1.08-4.34-1.07-2.25.01-2.72 1.1-4.38 1.08-1.87-.02-3.3-1.93-4.37-3.63C-1.02 15.3-1.3 9.1 1.09 5.98c1.15-1.5 2.97-2.38 4.68-2.38 1.74 0 2.83 1.08 4.27 1.08 1.4 0 2.25-1.08 4.26-1.08 1.52 0 3.13.83 4.28 2.26-3.76 2.06-3.15 7.42 1.92 11.34Z"/></svg>
          <span data-zh="下载 macOS 版" data-en="Download for macOS">下载 macOS 版</span>
        </a>
        <span class="dl" id="dlCount" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a1 1 0 0 1 1 1v9.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5A1 1 0 1 1 7.7 10.3l3.3 3.3V4a1 1 0 0 1 1-1Zm-7 15a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z"/></svg>
          <span id="dlText"></span>
        </span>
      </div>
      <p class="cta-note" data-zh="macOS 的按钮给的是 Apple Silicon（M 系列）版；Intel Mac 到发布页取 x64 版。" data-en="The macOS button is the Apple Silicon (M-series) build; Intel Macs take the x64 build from the releases page.">macOS 的按钮给的是 Apple Silicon（M 系列）版；Intel Mac 到发布页取 x64 版。</p>
      <div class="links">
        <a class="btn-ghost" href="https://github.com/yyh-001/DSH-X">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.3-5.28-1.29-5.28-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.16 1.18a10.9 10.9 0 0 1 5.75 0c2.2-1.49 3.16-1.18 3.16-1.18.62 1.59.23 2.77.11 3.06.74.81 1.18 1.84 1.18 3.1 0 4.42-2.71 5.39-5.29 5.68.42.36.78 1.07.78 2.15v3.27c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
          <span data-zh="在 GitHub 上查看" data-en="View on GitHub">在 GitHub 上查看</span>
        </a>
        <a class="btn-ghost" href="https://qm.qq.com/q/7AD2g70HqS"><span data-zh="QQ 群" data-en="QQ Group">QQ 群</span></a>
        <a class="ver" id="ver" href="https://github.com/yyh-001/DSH-X/releases/latest"></a>
      </div>
    </div>
    <div class="visual">
      <figure class="shot">
        <img src="./screenshot-home.png" alt="DSH-X 界面" />
      </figure>
    </div>
  </div>
  <script defer src="./water.js"></script>
  <script defer src="./mascot.js"></script>
  <script>
    // ---- 中英切换：文案写在 data-zh / data-en 上，带数字的句子靠变量重渲染 ----
    const LANG_KEY = 'dsh-x-lang'
    let lang = localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'zh'
    let starCount = null
    let downloadCount = null

    const STRINGS = {
      title: {
        zh: 'DSH-X — DeepSeek Harness 轻量启动器',
        en: 'DSH-X — a lightweight DeepSeek Harness launcher',
      },
      downloads: { zh: '已有 <b>{n}</b> 次下载', en: '<b>{n}</b> downloads' },
      starsLabel: { zh: 'GitHub 仓库，{n} stars', en: 'GitHub repository, {n} stars' },
    }

    function t(key, vars = {}) {
      let text = STRINGS[key][lang]
      for (const [name, value] of Object.entries(vars)) text = text.replace(`{${name}}`, value)
      return text
    }

    function renderStars() {
      if (starCount === null) return
      document.getElementById('star-count').textContent = fmtStars(starCount)
      document.getElementById('gh').setAttribute('aria-label', t('starsLabel', { n: starCount.toLocaleString() }))
      document.getElementById('stars').title = starCount.toLocaleString() + ' GitHub stars'
    }

    function renderDownloads() {
      const chip = document.getElementById('dlCount')
      if (downloadCount === null || !chip) return
      document.getElementById('dlText').innerHTML = t('downloads', { n: downloadCount.toLocaleString() })
      chip.hidden = false
    }

    function applyLang(next) {
      lang = next === 'en' ? 'en' : 'zh'
      localStorage.setItem(LANG_KEY, lang)
      for (const el of document.querySelectorAll('[data-zh]')) {
        el.textContent = (lang === 'en' ? el.dataset.en : el.dataset.zh) || el.dataset.zh
      }
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN'
      document.title = t('title')
      document.getElementById('lang').textContent = lang === 'en' ? '中文' : 'EN'
      renderStars()
      renderDownloads()
    }

    document.getElementById('lang').onclick = () => applyLang(lang === 'en' ? 'zh' : 'en')

    function fmtStars(n) {
      if (n >= 1000) {
        const k = n / 1000
        return (k >= 10 ? k.toFixed(1) : k.toFixed(1)).replace(/\.0$/, "") + "K"
      }
      return String(n)
    }
    fetch("https://api.github.com/repos/yyh-001/DSH-X")
      .then((r) => r.ok ? r.json() : null)
      .then((repo) => {
        if (!repo) return
        starCount = repo.stargazers_count
        renderStars()
      })
      .catch(() => {})
    // 下载次数：把所有 release 里安装包（Windows 的 exe + macOS 两个 dmg）的下载数加起来（只取 latest 会漏掉旧版本）
    const INSTALLERS = ["DSH-Setup.exe", "DSH-X-mac-arm64.dmg", "DSH-X-mac-x64.dmg"]
    fetch("https://api.github.com/repos/yyh-001/DSH-X/releases?per_page=100")
      .then((r) => r.ok ? r.json() : null)
      .then((list) => {
        if (!Array.isArray(list)) return
        const total = list.reduce((sum, rel) => sum + (rel.assets || [])
          .filter((a) => INSTALLERS.includes(a.name))
          .reduce((n, a) => n + (a.download_count || 0), 0), 0)
        if (!total) return
        downloadCount = total
        renderDownloads()
      })
      .catch(() => {})

    fetch("https://api.github.com/repos/yyh-001/DSH-X/releases/latest")
      .then((r) => r.ok ? r.json() : null)
      .then((rel) => {
        if (!rel || !rel.tag_name) return
        const asset = (rel.assets || []).find((a) => a.name === "DSH-Setup.exe")
        if (asset && asset.browser_download_url) {
          document.getElementById("download").href = asset.browser_download_url
        }
        // 两个平台都换成这一版release的真实资产地址；拿不到就继续用 latest/download 那条固定名
        const mac = (rel.assets || []).find((a) => a.name === "DSH-X-mac-arm64.dmg")
        if (mac && mac.browser_download_url) {
          document.getElementById("downloadMac").href = mac.browser_download_url
        }
        const ver = document.getElementById("ver")
        ver.textContent = rel.tag_name
        if (rel.html_url) ver.href = rel.html_url
      })
      .catch(() => {})

    applyLang(lang)
  </script>
</body>
</html>
