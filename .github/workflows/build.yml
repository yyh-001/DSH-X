# 打包：推 tag（或手动触发）时在 GitHub 的机器上出安装包。
#
# 为什么要有这个：mac 的包在 Windows 上打不出来（codesign / hdiutil 都是 macOS 独有），
# 所以 Windows 和 macOS 各自跑在自己的 runner 上；另外这也是「不怕本机环境差异」的一条路。
#
# 只上传资产、不创建 Release：Release 连同中文发行说明仍按原来的流程在本地建，
# 建完这个 workflow 会把产物补上去（Windows 的 exe + SBOM + 清单 + 签名，mac 的 dmg）。
#
# 签名是可选的：仓库里配了 DSH_RELEASE_KEY（私钥文件内容）才会签，没配就只出清单。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 往 Release 上传资产要这个

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 外壳换成 Electron 后打包要 devDependencies（@electron/packager + electron）
      - name: 安装打包依赖
        run: npm ci

      - name: 跑测试
        run: npm test

      - name: 写入签名私钥（没配 secret 就跳过）
        shell: bash
        env:
          KEY: ${{ secrets.DSH_RELEASE_KEY }}
        run: |
          mkdir -p release
          if [ -n "$KEY" ]; then printf '%s' "$KEY" > release/release-key.pem; echo "有私钥，本次会签名"; else echo "没有私钥，只出清单"; fi

      - name: 打包（Rust + Inno Setup，脚本会在 runner 上自己装 Inno）
        run: npm run dist

      # 核心走 npm 独立发版：把 app 层打成 dsh-x-core-win-<版本>.tgz
      - name: 打包核心 npm 包
        run: node scripts/pack-core.mjs

      - name: 发布核心到 npm
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "没有 NPM_TOKEN，跳过 npm 发布"; exit 0; fi
          VERSION="$(node -p "require('./package.json').version")"
          TAG="$(node --input-type=module -e "import { versionChannel } from './version.js'; import { readFileSync } from 'node:fs'; const v=JSON.parse(readFileSync('package.json','utf8')).version; console.log({official:'latest',rc:'rc',alpha:'alpha'}[versionChannel(v)] || 'latest')")"
          npm publish "release/dsh-x-core-win-$VERSION.tgz" --tag "$TAG" --access public

      - name: 校验清单（没配签名私钥就按「未签名」核体积与哈希）
        shell: bash
        run: |
          if [ -f release/release-key.pem ]; then node scripts/release-manifest.mjs verify
          else node scripts/release-manifest.mjs verify --unsigned-ok; fi

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Setup-windows
          path: |
            release/DSH-Setup.exe
            release/dsh-x-core-win-*.tgz
            release/dsh-x-*.spdx.json
            release/release-manifest.json
            release/release-manifest.sig
          if-no-files-found: error

      - name: 挂到同 tag 的 Release 上
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "还没有 $tag 的 Release，资产先留在 workflow artifacts 里；建好 Release 后再跑一次即可"
            exit 0
          fi
          # 安装包放发布页；核心包在 npm 上，SBOM/发布清单留在本机自查
          gh release upload "$tag" release/DSH-Setup.exe --clobber

  # mac 的打包能力在 PR #25（scripts/pack-mac.mjs）里，合并之后这里才真的会出包；
  # 没合并时这一步只打个招呼就过，不至于把整个 workflow 挂红。
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            arch: arm64
          - runner: macos-15-intel # Intel（macos-13 这个标签 GitHub 已经退役，用了会一直排队）
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      DSH_MAC_ARCH: ${{ matrix.arch }}
      # tag 构建只有在配置了固定证书时才强制签名；没配就退回 ad-hoc，
      # 否则没有证书的仓库打 tag 时 mac 两个 job 必红、dmg 出不来。
      DSH_MAC_REQUIRE_SIGNED: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.DSH_MAC_CERT_P12_BASE64 != '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 还没有 mac 打包支持就跳过
        id: probe
        run: |
          if [ -f scripts/pack-mac.mjs ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; echo "scripts/pack-mac.mjs 还不存在（PR #25 未合并），跳过 mac 打包"; fi

      # mac 外壳是 Electron（shell/）：打包要 devDependencies 里的 electron 与 @electron/packager
      - name: 安装打包依赖
        if: steps.probe.outputs.ready == 'yes'
        run: npm ci

      - name: 跑测试
        if: steps.probe.outputs.ready == 'yes'
        run: npm test

      - name: 导入固定 macOS 签名证书
        if: steps.probe.outputs.ready == 'yes'
        shell: bash
        env:
          DSH_MAC_CERT_P12_BASE64: ${{ secrets.DSH_MAC_CERT_P12_BASE64 }}
          DSH_MAC_CERT_PASSWORD: ${{ secrets.DSH_MAC_CERT_PASSWORD }}
          DSH_MAC_EXPECTED_SHA1: ${{ vars.DSH_MAC_SIGNING_SHA1 }}
        run: bash scripts/setup-mac-signing.sh

      - name: 打包（.app + .dmg，签名按配置）
        if: steps.probe.outputs.ready == 'yes'
        run: npm run dist

      # 核心走 npm 独立发版；两架构的 app 层内容相同，只让 arm64 打包/发布
      - name: 打包核心 npm 包
        if: steps.probe.outputs.ready == 'yes' && matrix.arch == 'arm64'
        run: node scripts/pack-core.mjs --app "release/DSH-X.app/Contents/Resources/app"

      - name: 发布核心到 npm
        if: steps.probe.outputs.ready == 'yes' && matrix.arch == 'arm64' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "没有 NPM_TOKEN，跳过 npm 发布"; exit 0; fi
          VERSION="$(node -p "require('./package.json').version")"
          TAG="$(node --input-type=module -e "import { versionChannel } from './version.js'; import { readFileSync } from 'node:fs'; const v=JSON.parse(readFileSync('package.json','utf8')).version; console.log({official:'latest',rc:'rc',alpha:'alpha'}[versionChannel(v)] || 'latest')")"
          npm publish "release/dsh-x-core-mac-$VERSION.tgz" --tag "$TAG" --access public

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.ready == 'yes'
        with:
          name: DSH-X-mac-${{ matrix.arch }}
          path: |
            release/DSH-X-mac-*.dmg
            release/dsh-x-core-mac-*.tgz
          if-no-files-found: error

      - name: 挂到同 tag 的 Release 上
        if: steps.probe.outputs.ready == 'yes' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/DSH-X-mac-*.dmg --clobber
          else
            echo "还没有 $tag 的 Release，dmg 先留在 workflow artifacts 里"
          fi

      - name: 清理临时签名钥匙串
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dsh-mac-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/dsh-mac-signing.keychain-db"
          fi

  # npm 版：CLI 包 + 从 npm 拉平台核心。等两个平台的包都出完再发，保证核心包先到 registry。
  npm-package:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 打包并发布 dsh-x npm 包
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] || ! [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/pack-npm.mjs
            echo "没有 NPM_TOKEN 或不是 tag，只打包不发布"
            exit 0
          fi
          node scripts/pack-npm.mjs --publish

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-x-npm
          path: release/dsh-x-*.tgz
          if-no-files-found: error
