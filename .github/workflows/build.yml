# 打包：推 tag（或手动触发）时在 GitHub 的机器上出安装包。
#
# 为什么要有这个：mac 的包在 Windows 上打不出来（codesign / hdiutil 都是 macOS 独有），
# 所以 Windows 和 macOS 各自跑在自己的 runner 上；另外这也是「不怕本机环境差异」的一条路。
#
# 只上传资产、不创建 Release：Release 连同中文发行说明仍按原来的流程在本地建，
# 建完这个 workflow 会把产物补上去（Windows 的 exe + SBOM + 清单 + 签名，mac 的 dmg）。
#
# 签名是可选的：仓库里配了 DSH_RELEASE_KEY（私钥文件内容）才会签，没配就只出清单。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 往 Release 上传资产要这个

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 跑测试
        run: npm test

      - name: 写入签名私钥（没配 secret 就跳过）
        shell: bash
        env:
          KEY: ${{ secrets.DSH_RELEASE_KEY }}
        run: |
          mkdir -p release
          if [ -n "$KEY" ]; then printf '%s' "$KEY" > release/release-key.pem; echo "有私钥，本次会签名"; else echo "没有私钥，只出清单"; fi

      - name: 打包（Rust + Inno Setup，脚本会在 runner 上自己装 Inno）
        run: npm run dist

      - name: 校验清单（没配签名私钥就按「未签名」核体积与哈希）
        shell: bash
        run: |
          if [ -f release/release-key.pem ]; then node scripts/release-manifest.mjs verify
          else node scripts/release-manifest.mjs verify --unsigned-ok; fi

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Setup-windows
          path: |
            release/DSH-Setup.exe
            release/dsh-x-*.spdx.json
            release/release-manifest.json
            release/release-manifest.sig
          if-no-files-found: error

      - name: 挂到同 tag 的 Release 上
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "还没有 $tag 的 Release，资产先留在 workflow artifacts 里；建好 Release 后再跑一次即可"
            exit 0
          fi
          # 安装包 + SBOM + 清单 + 签名是一套：要换一起换。没签名这次就别动 Release，
          # 免得把本机签好的那套覆盖成没签名的（清单哈希也对不上新 exe）。
          if [ ! -f release/release-manifest.sig ]; then
            echo "这次没有签名（没配 DSH_RELEASE_KEY），不动 Release 上的资产"
            exit 0
          fi
          gh release upload "$tag" release/DSH-Setup.exe release/dsh-x-*.spdx.json release/release-manifest.json release/release-manifest.sig --clobber

  # mac 的打包能力在 PR #25（scripts/pack-mac.mjs）里，合并之后这里才真的会出包；
  # 没合并时这一步只打个招呼就过，不至于把整个 workflow 挂红。
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            arch: arm64
          - runner: macos-15-intel # Intel（macos-13 这个标签 GitHub 已经退役，用了会一直排队）
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      DSH_MAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 还没有 mac 打包支持就跳过
        id: probe
        run: |
          if [ -f scripts/pack-mac.mjs ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; echo "scripts/pack-mac.mjs 还不存在（PR #25 未合并），跳过 mac 打包"; fi

      - name: 跑测试
        if: steps.probe.outputs.ready == 'yes'
        run: npm test

      - name: 打包（.app + .dmg，ad-hoc 签名）
        if: steps.probe.outputs.ready == 'yes'
        run: npm run dist

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.ready == 'yes'
        with:
          name: DSH-X-mac-${{ matrix.arch }}
          # 清单/SBOM 目前只有 Windows 的 pack.mjs 会生成，mac 这边先只传 dmg；
          # 两平台各写一份同名清单会互相覆盖，等清单支持多产物之后再说
          path: release/DSH-X-mac-*.dmg
          if-no-files-found: error

      - name: 挂到同 tag 的 Release 上
        if: steps.probe.outputs.ready == 'yes' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/DSH-X-mac-*.dmg --clobber
          else
            echo "还没有 $tag 的 Release，dmg 先留在 workflow artifacts 里"
          fi
