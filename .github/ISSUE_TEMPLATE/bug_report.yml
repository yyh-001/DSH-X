name: 报告问题
description: 启动、更新、插件、整合包、同步等使用上的问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        贴日志前先扫一眼：里面可能有你的用户名、路径和 profile 名。

        安全问题别走这里，见 [SECURITY.md](https://github.com/yyh-001/DSH-X/blob/master/SECURITY.md)。
        DSH 页面本身的问题属于上游，请去 [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness/issues)。

  - type: input
    id: version
    attributes:
      label: DSH-X 版本
      description: 管理页「设置 → 关于」里那一行
      placeholder: 0.1.22
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - Windows 11
        - Windows 10
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Linux
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - Windows 安装包（DSH-X-…-win-x64.exe）
        - macOS dmg
        - Linux AppImage
        - npm 全局（@yyh001/dsh-x）
        - 源码运行
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 预期看到什么，实际看到什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: 出问题的 dsh 版本 / profile
      description: 例如 0.2.2-alpha.2 @ web。跟启动器无关的可以留空
      placeholder: 0.2.2-alpha.2 @ web
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        `manager.log` 的相关片段。位置：
        Windows `%APPDATA%\DSH\`，macOS `~/Library/Application Support/DSH/`，Linux `~/.config/DSH/`
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已看过 README 和已有 issue，没有重复
          required: true
